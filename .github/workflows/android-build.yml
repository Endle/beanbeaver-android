name: Android build

# Android twin of beanbeaver-ios's ios-build.yml. Same shape — cross-compile the
# Rust core, build the app, then run the shared receipt fixture through the real
# pipeline and grade it with shared/scripts/compare-e2e.py — with one difference worth
# understanding before you try to "fix" it:
#
#   THERE IS NO EMULATOR JOB, and it isn't an oversight.
#   The app is arm64-v8a only, because `ort` publishes no x86_64-linux-android
#   prebuilt (see build-android.sh). GitHub's x86_64 Linux runners are the only
#   hosted runners with KVM, and they can't install an arm64-only APK. The
#   Apple-Silicon macOS runners can't stand in either: Apple's Virtualization
#   Framework has no nested virtualization, so HVF is unavailable inside the
#   runner VM and an arm64 AVD dies with HV_UNSUPPORTED / SIGSEGV. Linux arm64
#   runners have no KVM for the same Azure-side reason.
#   Running the app for real therefore needs a self-hosted arm64 Mac runner or a
#   device farm (Firebase Test Lab). Locally it is one command:
#       ./scripts/android-e2e.sh "$(./scripts/e2e-fixtures.sh)" --pilot
#
# What the "Host E2E" step below buys instead: the same core, the same models,
# the same fixture and the same grader as the on-device harness — everything
# except the JNI seam. It is the runtime gate that catches a core-tag bump that
# quietly changes a parse. The JNI seam itself is still only proven by running
# the APK on real arm64 hardware.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK + unit tests + host E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # shared/ (beanbeaver-mobile-util) holds the uniffi-bindgen and
          # batch_e2e sources the Cargo.toml [[bin]] paths point at, plus
          # fetch-models.sh and compare-e2e.py. Without this the cargo
          # build fails on a missing bin path.
          submodules: true

      # Android Studio's bundled JBR is 21 locally; match it here. AGP 8.13
      # needs >= 17, and the modules compile to jvmTarget 17 either way.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # Cargo registry/git + build outputs, *plus* the prebuilt libonnxruntime
      # that `ort` downloads to ~/.cache/ort.pyke.io — once for the
      # aarch64-linux-android .so, once for the host batch_e2e binary. Keyed on
      # Cargo.lock so it busts when deps change.
      #
      # These MUST stay one entry, and this is why Swatinem/rust-cache is not
      # used here. They were two (rust-cache for target/, a separate
      # actions/cache for the ORT dir) and that is exactly the pairing that
      # wedged beanbeaver-ios's main branch — fixed there in ios #57, ported
      # here. A restored target/ marks ort-sys's build script as already run, so
      # the download that would refill the ORT dir never fires, and nothing else
      # can produce that archive; the build then fails on a missing
      # libonnxruntime with no hint that a cache is at fault. Independent
      # eviction makes that reachable, and Actions evicts by size and age. One
      # entry makes a hit on one impossible without the other.
      - name: Cache cargo + ONNX Runtime
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cache/ort.pyke.io
          key: cargo-ort-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ort-${{ runner.os }}-

      # ~19 MB of ONNX weights pulled from a fixed release tag, so the key only
      # has to change when the script points at a different release.
      - name: Cache OCR models
        uses: actions/cache@v4
        with:
          path: models
          key: ocr-models-${{ hashFiles('shared/scripts/fetch-models.sh') }}

      - name: Fetch OCR models
        run: ./shared/scripts/fetch-models.sh

      - uses: gradle/actions/setup-gradle@v4

      # gradle.properties is the single source of truth for the NDK revision, and
      # the runner's own ANDROID_NDK_LATEST_HOME is whatever that image happens
      # to ship — it drifts out from under you. Read the pin instead.
      - name: Read the pinned NDK version
        run: |
          echo "BB_NDK=$(awk -F= '/^bb\.ndkVersion=/{gsub(/[[:space:]]/,"",$2); print $2}' \
            gradle.properties)" >> "$GITHUB_ENV"

      # compileSdk 36 + buildToolsVersion 36.0.0 are pinned in
      # app/build.gradle.kts, and the NDK in gradle.properties; the runner image
      # doesn't necessarily ship those exact revisions, and AGP won't fetch them.
      - name: Install the pinned SDK packages
        run: |
          # `yes |` is load-bearing: the pinned NDK is a *preview* package, so
          # sdkmanager stops on the unaccepted android-sdk-preview-license — and
          # still exits 0, leaving the NDK uninstalled. Without this the job dies
          # two steps later in build-android.sh with a confusing version
          # mismatch against whatever NDK the runner image happened to ship.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;$BB_NDK"
          # Fail here, where the cause is legible, rather than downstream.
          test -d "$ANDROID_HOME/ndk/$BB_NDK" || {
            echo "::error::sdkmanager did not install ndk;$BB_NDK"; exit 1; }

      # Cross-compiles bb-receipt-ffi for aarch64-linux-android and regenerates
      # the UniFFI Kotlin. Both are git-ignored, so nothing in bbreceiptkit/ even
      # compiles until this runs. Debug profile: quicker, and enough to prove the
      # tree is green. This is also the step that fails loudly when the pinned
      # core tag moves and ReceiptScanner.kt wasn't adapted.
      - name: Build core (.so + UniFFI Kotlin bindings)
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$BB_NDK" PROFILE=debug ./build-android.sh

      - name: Assemble debug APK
        run: ./gradlew :app:assembleFullDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-full-debug-apk
          path: app/build/outputs/apk/full/debug/app-full-debug.apk
          if-no-files-found: error

      # Context-free JVM logic: the .xlsx writer, amount/price normalization,
      # display formatting. No emulator, no native library.
      - name: JVM unit tests
        run: ./gradlew :app:testFullDebugUnitTest

      - name: Android Lint
        run: ./gradlew :app:lintFullDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results-full-debug
          path: app/build/reports/lint-results-fullDebug.*
          if-no-files-found: ignore

      # The runtime gate. batch_e2e is the host twin of the on-device
      # BatchRunner: same OcrSession, same ledger defaults, same batch_out.json
      # shape, graded by the same compare-e2e.py the emulator harness uses.
      # Release profile — a debug build of the image/OCR path is minutes slower
      # per scan, and the cargo cache makes this a rebuild of one crate.
      - name: Host E2E — scan the bundled fixture and grade it
        run: |
          set -euo pipefail
          FIX=$(./scripts/e2e-fixtures.sh)
          cargo run --release --bin batch_e2e -- \
            --models models --in-dir "$FIX" --out "$FIX/batch_out.json"
          python3 shared/scripts/compare-e2e.py \
            --results "$FIX/batch_out.json" --manifest "$FIX/manifest.json"

  # The path that actually ships, which nothing exercised until v0.4.0 reached
  # Play as an 81.8 MiB bundle carrying a debug native library. The debug job
  # above deliberately builds PROFILE=debug for speed, so it can prove neither
  # R8 (which only runs for release) nor the strip/symbol extraction — and both
  # gates refuse to run against a debug library, correctly.
  #
  # What this cannot do is prove the JNI seam under R8: no hosted runner can run
  # an arm64 AVD (see the header). That still needs real hardware.
  release-bundle:
    name: Release bundle (R8 + strip + Play gates)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # shared/ (beanbeaver-mobile-util) holds the uniffi-bindgen and
          # batch_e2e sources the Cargo.toml [[bin]] paths point at, plus
          # fetch-models.sh and compare-e2e.py. Without this the cargo
          # build fails on a missing bin path.
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # One entry, same reason as the build job above: target/ and the ORT
      # download directory must be restored together or not at all.
      - name: Cache cargo + ONNX Runtime
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cache/ort.pyke.io
          key: cargo-ort-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ort-${{ runner.os }}-

      - name: Cache OCR models
        uses: actions/cache@v4
        with:
          path: models
          key: ocr-models-${{ hashFiles('shared/scripts/fetch-models.sh') }}

      - name: Fetch OCR models
        run: ./shared/scripts/fetch-models.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Read the pinned NDK version
        run: |
          echo "BB_NDK=$(awk -F= '/^bb\.ndkVersion=/{gsub(/[[:space:]]/,"",$2); print $2}' \
            gradle.properties)" >> "$GITHUB_ENV"

      # The NDK matters more here than in the debug job: AGP strips the .so and
      # extracts the Play debug symbols with it, and silently does neither when
      # it can't resolve one.
      - name: Install the pinned SDK packages
        run: |
          # `yes |` is load-bearing: the pinned NDK is a *preview* package, so
          # sdkmanager stops on the unaccepted android-sdk-preview-license — and
          # still exits 0, leaving the NDK uninstalled. Without this the job dies
          # two steps later in build-android.sh with a confusing version
          # mismatch against whatever NDK the runner image happened to ship.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;$BB_NDK"
          # Fail here, where the cause is legible, rather than downstream.
          test -d "$ANDROID_HOME/ndk/$BB_NDK" || {
            echo "::error::sdkmanager did not install ndk;$BB_NDK"; exit 1; }

      # Release profile on purpose — it is the whole point of this job, and
      # bbreceiptkit's verifyReleaseNativeProfile would refuse a debug library.
      - name: Build core (release .so + UniFFI Kotlin bindings)
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$BB_NDK" ./build-android.sh

      # Unsigned: keystore.properties isn't in git, and signing has no bearing on
      # what the gates read (dex, native libs, BUNDLE-METADATA). verifyReleaseBundle
      # runs automatically as a finalizer.
      - name: Bundle release
        run: ./gradlew :app:bundleFullRelease

      # R8 over the *foss* source set, which nothing else covers: fdroid.yml
      # builds foss debug (unminified), and this job's bundle is `full`. A
      # flavour-specific source file that R8 mishandles would otherwise only
      # surface in an F-Droid build we don't run. It lives here rather than in
      # fdroid.yml because this job already has a release-profile .so, and
      # because it is about R8, not about ONNX Runtime. APK, not bundle —
      # F-Droid publishes APKs, and it keeps verifyFossReleaseBundle out of the
      # way. Note fdroid.yml's path filter must keep firing for foss sources, or
      # this becomes the only coverage the flavour has on an unrelated PR.
      - name: Assemble foss release (R8 over the F-Droid source set)
        run: ./gradlew :app:assembleFossRelease

      - name: Report what shipped
        run: |
          AAB=app/build/outputs/bundle/fullRelease/app-full-release.aab
          ls -l "$AAB"
          unzip -l "$AAB" | grep -E "\.so$|\.dex$|BUNDLE-METADATA" || true

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-full-release-aab
          path: app/build/outputs/bundle/fullRelease/app-full-release.aab
          if-no-files-found: error

name: Android build

# Android twin of beanbeaver-ios's ios-build.yml. Same shape — cross-compile the
# Rust core, build the app, then run the shared receipt fixture through the real
# pipeline and grade it with scripts/compare-e2e.py — with one difference worth
# understanding before you try to "fix" it:
#
#   THERE IS NO EMULATOR JOB, and it isn't an oversight.
#   The app is arm64-v8a only, because `ort` publishes no x86_64-linux-android
#   prebuilt (see build-android.sh). GitHub's x86_64 Linux runners are the only
#   hosted runners with KVM, and they can't install an arm64-only APK. The
#   Apple-Silicon macOS runners can't stand in either: Apple's Virtualization
#   Framework has no nested virtualization, so HVF is unavailable inside the
#   runner VM and an arm64 AVD dies with HV_UNSUPPORTED / SIGSEGV. Linux arm64
#   runners have no KVM for the same Azure-side reason.
#   Running the app for real therefore needs a self-hosted arm64 Mac runner or a
#   device farm (Firebase Test Lab). Locally it is one command:
#       ./scripts/android-e2e.sh "$(./scripts/e2e-fixtures.sh)" --pilot
#
# What the "Host E2E" step below buys instead: the same core, the same models,
# the same fixture and the same grader as the on-device harness — everything
# except the JNI seam. It is the runtime gate that catches a core-tag bump that
# quietly changes a parse. The JNI seam itself is still only proven by running
# the APK on real arm64 hardware.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK + unit tests + host E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Android Studio's bundled JBR is 21 locally; match it here. AGP 8.13
      # needs >= 17, and the modules compile to jvmTarget 17 either way.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # `ort` downloads a prebuilt libonnxruntime into this cache — once for the
      # aarch64-linux-android .so, once for the host batch_e2e binary.
      - name: Cache ONNX Runtime
        uses: actions/cache@v4
        with:
          path: ~/.cache/ort.pyke.io
          key: ort-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ort-${{ runner.os }}-

      # ~19 MB of ONNX weights pulled from a fixed release tag, so the key only
      # has to change when the script points at a different release.
      - name: Cache OCR models
        uses: actions/cache@v4
        with:
          path: models
          key: ocr-models-${{ hashFiles('scripts/fetch-models.sh') }}

      - name: Fetch OCR models
        run: ./scripts/fetch-models.sh

      - uses: gradle/actions/setup-gradle@v4

      # gradle.properties is the single source of truth for the NDK revision, and
      # the runner's own ANDROID_NDK_LATEST_HOME is whatever that image happens
      # to ship — it drifts out from under you. Read the pin instead.
      - name: Read the pinned NDK version
        run: |
          echo "BB_NDK=$(awk -F= '/^bb\.ndkVersion=/{gsub(/[[:space:]]/,"",$2); print $2}' \
            gradle.properties)" >> "$GITHUB_ENV"

      # compileSdk 36 + buildToolsVersion 36.0.0 are pinned in
      # app/build.gradle.kts, and the NDK in gradle.properties; the runner image
      # doesn't necessarily ship those exact revisions, and AGP won't fetch them.
      - name: Install the pinned SDK packages
        run: |
          # `yes |` is load-bearing: the pinned NDK is a *preview* package, so
          # sdkmanager stops on the unaccepted android-sdk-preview-license — and
          # still exits 0, leaving the NDK uninstalled. Without this the job dies
          # two steps later in build-android.sh with a confusing version
          # mismatch against whatever NDK the runner image happened to ship.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;$BB_NDK"
          # Fail here, where the cause is legible, rather than downstream.
          test -d "$ANDROID_HOME/ndk/$BB_NDK" || {
            echo "::error::sdkmanager did not install ndk;$BB_NDK"; exit 1; }

      # Cross-compiles bb-receipt-ffi for aarch64-linux-android and regenerates
      # the UniFFI Kotlin. Both are git-ignored, so nothing in bbreceiptkit/ even
      # compiles until this runs. Debug profile: quicker, and enough to prove the
      # tree is green. This is also the step that fails loudly when the pinned
      # core tag moves and ReceiptScanner.kt wasn't adapted.
      - name: Build core (.so + UniFFI Kotlin bindings)
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$BB_NDK" PROFILE=debug ./build-android.sh

      - name: Assemble debug APK
        run: ./gradlew :app:assembleFullDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-full-debug-apk
          path: app/build/outputs/apk/full/debug/app-full-debug.apk
          if-no-files-found: error

      # Context-free JVM logic: the .xlsx writer, amount/price normalization,
      # display formatting. No emulator, no native library.
      - name: JVM unit tests
        run: ./gradlew :app:testFullDebugUnitTest

      - name: Android Lint
        run: ./gradlew :app:lintFullDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results-full-debug
          path: app/build/reports/lint-results-fullDebug.*
          if-no-files-found: ignore

      # The runtime gate. batch_e2e is the host twin of the on-device
      # BatchRunner: same OcrSession, same ledger defaults, same batch_out.json
      # shape, graded by the same compare-e2e.py the emulator harness uses.
      # Release profile — a debug build of the image/OCR path is minutes slower
      # per scan, and the cargo cache makes this a rebuild of one crate.
      - name: Host E2E — scan the bundled fixture and grade it
        run: |
          set -euo pipefail
          FIX=$(./scripts/e2e-fixtures.sh)
          cargo run --release --bin batch_e2e -- \
            --models models --in-dir "$FIX" --out "$FIX/batch_out.json"
          python3 scripts/compare-e2e.py \
            --results "$FIX/batch_out.json" --manifest "$FIX/manifest.json"

  # The F-Droid path: ONNX Runtime compiled from source instead of downloaded.
  #
  # F-Droid never accepts a prebuilt shared library, and `ort`'s default
  # `download-binaries` fetches one from pyke's CDN — so this is the build that
  # would have to work before the app can be submitted. It is here to keep that
  # working: the wiring is easy to break from a distance (a core tag bump that
  # moves the ort version, a new unconditional `-l static=…` in ort-sys) and the
  # failure is invisible to every other job, all of which happily download.
  #
  # Deliberately NOT using Swatinem/rust-cache here. The ORT archives are a build
  # input that lives *outside* target/, and caching the two independently is what
  # wedged beanbeaver-ios's main branch (ios #57): cargo restores a target/ whose
  # ort-sys fingerprint says "already linked", the archives it points at are gone
  # or different, and the build script never reruns to notice. One cache, of the
  # archives only, and a cold cargo tree that always re-resolves against it.
  fdroid-ort-from-source:
    name: FOSS build (ONNX Runtime from source)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # First, not alongside the SDK install as in the jobs above: the ORT cache
      # key below is built from it, and a step cannot read an env var that a
      # later step exports.
      - name: Read the pinned NDK version
        run: |
          echo "BB_NDK=$(awk -F= '/^bb\.ndkVersion=/{gsub(/[[:space:]]/,"",$2); print $2}' \
            gradle.properties)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # ORT wants cmake >= 3.28 (the runner image is well past that) and ninja,
      # which is not installed by default.
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Only the static archives, not the 500 MB of object files around them —
      # on a hit, build-ort-android.sh --print-lib-location sees the two files it
      # checks for and skips the build entirely. Keyed on everything that changes
      # what gets compiled; Cargo.lock is in there because the ORT version is
      # derived from the resolved ort-sys.
      - name: Cache ONNX Runtime static libs
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: |
            target/ort/build-arm64-v8a/Release/*.a
            target/ort/build-arm64-v8a/Release/_deps/**/*.a
          key: ort-src-${{ runner.os }}-${{ env.BB_NDK }}-${{ hashFiles('scripts/build-ort-android.sh', 'Cargo.lock') }}

      - name: Cache OCR models
        uses: actions/cache@v4
        with:
          path: models
          key: ocr-models-${{ hashFiles('scripts/fetch-models.sh') }}

      - name: Fetch OCR models
        run: ./scripts/fetch-models.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the pinned SDK packages
        run: |
          # See the identical step above for why `yes |` is load-bearing.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;$BB_NDK"
          test -d "$ANDROID_HOME/ndk/$BB_NDK" || {
            echo "::error::sdkmanager did not install ndk;$BB_NDK"; exit 1; }

      # ANDROID_NDK_HOME is passed explicitly because the runner image presets it
      # to whatever NDK it ships; the script refuses a mismatch rather than
      # quietly compiling ORT against a different one than the Rust side uses.
      # --print-lib-location rather than a plain run, and not guarded by
      # `if: cache-hit != 'true'`: it compiles when the archives are absent and
      # short-circuits when the cache restored them, so one invocation is right
      # either way. (A plain run would re-clone and rebuild even on a hit, since
      # only the archives are cached, not the 889 MB source tree.)
      - name: Build ONNX Runtime from source (skipped when cached)
        run: |
          set -euo pipefail
          LIB="$(ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$BB_NDK" \
            ./scripts/build-ort-android.sh --print-lib-location)"
          echo "ORT_LIB_DIR=$LIB" >> "$GITHUB_ENV"

      - name: Build core against it (.so + UniFFI Kotlin bindings)
        run: |
          set -euo pipefail
          echo "linking against $ORT_LIB_DIR"
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$BB_NDK" \
            ORT_ANDROID_LIB_LOCATION="$ORT_LIB_DIR" PROFILE=debug ./build-android.sh

      # The actual F-Droid properties, asserted rather than assumed.
      - name: Assert nothing prebuilt reached the Android library
        run: |
          set -euo pipefail
          SO=bbreceiptkit/src/main/jniLibs/arm64-v8a/libbb_receipt_ffi.so
          READELF="$ANDROID_HOME/ndk/$BB_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          echo "== DT_NEEDED =="
          "$READELF" -d "$SO" | grep NEEDED
          if "$READELF" -d "$SO" | grep -q 'libonnxruntime'; then
            echo "::error::$SO wants a separate libonnxruntime.so; ORT was not linked statically"
            exit 1
          fi

          # ort-sys caches every CDN download under a per-target directory, so
          # this is a direct statement that the aarch64 library was not fetched.
          #
          # Only the Android target is asserted, and that is not an oversight:
          # build-android.sh also runs a *host* cargo build to generate the Kotlin
          # bindings, and that one does still download a host prebuilt. It is not
          # shipped in the APK — but it is a real open question for F-Droid, whose
          # build would run this same script. Tracked separately.
          CACHED=~/.cache/ort.pyke.io/dfbin/aarch64-linux-android
          if [ -d "$CACHED" ]; then
            echo "::error::$CACHED exists — a prebuilt aarch64 ONNX Runtime was downloaded"
            exit 1
          fi
          echo "OK: ORT statically linked from source, no aarch64 prebuilt fetched"

      # The foss flavour, not the default one: this job is the F-Droid build in
      # full, and the GMS assertion below is only meaningful against it.
      - name: Assemble foss debug APK
        run: ./gradlew :app:assembleFossDebug

      # The other half of the F-Droid contract. GMS is named in the inclusion
      # policy as not accepted, so a stray `implementation(...)` that reintroduces
      # it — or a foss source-set file that imports one — has to fail here, where
      # it is one line to read, rather than in a reviewer's queue weeks later.
      - name: Assert no Google Play services in the foss APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/foss/debug/app-foss-debug.apk
          # grep -a: dex is binary. Package paths appear as plain strings in the
          # dex string pool, so this sees classes R8 kept for any reason.
          HITS=$(unzip -p "$APK" 'classes*.dex' \
            | LC_ALL=C grep -a -o 'com/google/android/gms/[a-z]*' | sort -u || true)
          if [ -n "$HITS" ]; then
            echo "::error::foss APK references Google Play services:"
            echo "$HITS"
            exit 1
          fi
          echo "OK: no com.google.android.gms references in $APK"

      - name: Report what was built
        run: |
          {
            echo "### FOSS build (ONNX Runtime from source, no Play services)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| ONNX Runtime | built from source, statically linked |"
            echo "| static libs | $(du -ch "$ORT_LIB_DIR"/*.a | tail -1 | cut -f1) |"
            echo "| \`libbb_receipt_ffi.so\` | $(stat -c%s bbreceiptkit/src/main/jniLibs/arm64-v8a/libbb_receipt_ffi.so) B |"
            echo "| foss APK | $(stat -c%s app/build/outputs/apk/foss/debug/app-foss-debug.apk) B |"
            echo "| Play services | none |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload FOSS native library
        uses: actions/upload-artifact@v4
        with:
          name: libbb_receipt_ffi-foss-arm64-v8a
          path: bbreceiptkit/src/main/jniLibs/arm64-v8a/libbb_receipt_ffi.so
          if-no-files-found: error

  # The path that actually ships, which nothing exercised until v0.4.0 reached
  # Play as an 81.8 MiB bundle carrying a debug native library. The debug job
  # above deliberately builds PROFILE=debug for speed, so it can prove neither
  # R8 (which only runs for release) nor the strip/symbol extraction — and both
  # gates refuse to run against a debug library, correctly.
  #
  # What this cannot do is prove the JNI seam under R8: no hosted runner can run
  # an arm64 AVD (see the header). That still needs real hardware.
  release-bundle:
    name: Release bundle (R8 + strip + Play gates)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache ONNX Runtime
        uses: actions/cache@v4
        with:
          path: ~/.cache/ort.pyke.io
          key: ort-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ort-${{ runner.os }}-

      - name: Cache OCR models
        uses: actions/cache@v4
        with:
          path: models
          key: ocr-models-${{ hashFiles('scripts/fetch-models.sh') }}

      - name: Fetch OCR models
        run: ./scripts/fetch-models.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Read the pinned NDK version
        run: |
          echo "BB_NDK=$(awk -F= '/^bb\.ndkVersion=/{gsub(/[[:space:]]/,"",$2); print $2}' \
            gradle.properties)" >> "$GITHUB_ENV"

      # The NDK matters more here than in the debug job: AGP strips the .so and
      # extracts the Play debug symbols with it, and silently does neither when
      # it can't resolve one.
      - name: Install the pinned SDK packages
        run: |
          # `yes |` is load-bearing: the pinned NDK is a *preview* package, so
          # sdkmanager stops on the unaccepted android-sdk-preview-license — and
          # still exits 0, leaving the NDK uninstalled. Without this the job dies
          # two steps later in build-android.sh with a confusing version
          # mismatch against whatever NDK the runner image happened to ship.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;$BB_NDK"
          # Fail here, where the cause is legible, rather than downstream.
          test -d "$ANDROID_HOME/ndk/$BB_NDK" || {
            echo "::error::sdkmanager did not install ndk;$BB_NDK"; exit 1; }

      # Release profile on purpose — it is the whole point of this job, and
      # bbreceiptkit's verifyReleaseNativeProfile would refuse a debug library.
      - name: Build core (release .so + UniFFI Kotlin bindings)
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$BB_NDK" ./build-android.sh

      # Unsigned: keystore.properties isn't in git, and signing has no bearing on
      # what the gates read (dex, native libs, BUNDLE-METADATA). verifyReleaseBundle
      # runs automatically as a finalizer.
      - name: Bundle release
        run: ./gradlew :app:bundleFullRelease

      # R8 over the *foss* source set, which nothing else covers: the FOSS job
      # builds it debug (unminified) for speed, and this job's bundle is `full`.
      # A flavour-specific source file that R8 mishandles would otherwise only
      # surface in an F-Droid build we don't run. APK, not bundle — F-Droid
      # publishes APKs, and it keeps verifyFossReleaseBundle out of the way.
      - name: Assemble foss release (R8 over the F-Droid source set)
        run: ./gradlew :app:assembleFossRelease

      - name: Report what shipped
        run: |
          AAB=app/build/outputs/bundle/fullRelease/app-full-release.aab
          ls -l "$AAB"
          unzip -l "$AAB" | grep -E "\.so$|\.dex$|BUNDLE-METADATA" || true

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-full-release-aab
          path: app/build/outputs/bundle/fullRelease/app-full-release.aab
          if-no-files-found: error

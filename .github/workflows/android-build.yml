name: Android build

# Android twin of beanbeaver-ios's ios-build.yml. Same shape — cross-compile the
# Rust core, build the app, then run the shared receipt fixture through the real
# pipeline and grade it with shared/scripts/compare-e2e.py — with one difference worth
# understanding before you try to "fix" it:
#
#   THERE IS NO EMULATOR JOB, and it isn't an oversight.
#   The app is arm64-v8a only, because `ort` publishes no x86_64-linux-android
#   prebuilt (see build-android.sh). GitHub's x86_64 Linux runners are the only
#   hosted runners with KVM, and they can't install an arm64-only APK. The
#   Apple-Silicon macOS runners can't stand in either: Apple's Virtualization
#   Framework has no nested virtualization, so HVF is unavailable inside the
#   runner VM and an arm64 AVD dies with HV_UNSUPPORTED / SIGSEGV. Linux arm64
#   runners have no KVM for the same Azure-side reason.
#   Running the app for real therefore needs a self-hosted arm64 Mac runner or a
#   device farm (Firebase Test Lab). Locally it is one command:
#       ./scripts/android-e2e.sh "$(./scripts/e2e-fixtures.sh)" --pilot
#
# What the "Host E2E" step below buys instead: the same core, the same models,
# the same fixture and the same grader as the on-device harness — everything
# except the JNI seam. It is the runtime gate that catches a core-tag bump that
# quietly changes a parse. The JNI seam itself is still only proven by running
# the APK on real arm64 hardware.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ONNX Runtime is compiled from source for every build here, because that is
  # what ships to every channel (see build-android.sh's header).
  #
  # Out of `target/` deliberately, which is where build-ort-android.sh puts it by
  # default: `target` is in the cargo cache entry below, and the ORT tree is
  # 2.2 GB — 892 MB of git checkout plus 495 MB of build output. Caching that
  # wholesale would blow most of the repo's 10 GB Actions budget and start
  # evicting the entries that actually matter. Kept separate, only the 112 MB of
  # .a files need storing.
  ORT_BUILD_DIR: ${{ github.workspace }}/.ort

jobs:
  build:
    name: Build APK + unit tests + host E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # shared/ (beanbeaver-mobile-util) holds the uniffi-bindgen and
          # batch_e2e sources the Cargo.toml [[bin]] paths point at, plus
          # fetch-models.sh and compare-e2e.py. Without this the cargo
          # build fails on a missing bin path.
          submodules: true

      # Android Studio's bundled JBR is 21 locally; match it here. AGP 8.13
      # needs >= 17, and the modules compile to jvmTarget 17 either way.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # Cargo registry/git + build outputs, *plus* the prebuilt libonnxruntime
      # that `ort` downloads to ~/.cache/ort.pyke.io — once for the
      # aarch64-linux-android .so, once for the host batch_e2e binary. Keyed on
      # Cargo.lock so it busts when deps change.
      #
      # These MUST stay one entry, and this is why Swatinem/rust-cache is not
      # used here. They were two (rust-cache for target/, a separate
      # actions/cache for the ORT dir) and that is exactly the pairing that
      # wedged beanbeaver-ios's main branch — fixed there in ios #57, ported
      # here. A restored target/ marks ort-sys's build script as already run, so
      # the download that would refill the ORT dir never fires, and nothing else
      # can produce that archive; the build then fails on a missing
      # libonnxruntime with no hint that a cache is at fault. Independent
      # eviction makes that reachable, and Actions evicts by size and age. One
      # entry makes a hit on one impossible without the other.
      - name: Cache cargo + ONNX Runtime
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cache/ort.pyke.io
          key: cargo-ort-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ort-${{ runner.os }}-

      # The cache entry above still carries an aarch64 prebuilt downloaded before
      # ORT was built from source everywhere (#28), and its key is Cargo.lock —
      # untouched since #23 — so it restores on every run. The "was ORT
      # downloaded?" assertion below reads that directory, which made it fail on
      # a cached artefact rather than on anything this build did, and wedged
      # master: an exact-key hit is never re-saved, and an entry read every run
      # never ages out.
      #
      # Clearing it here restores the assertion's meaning — the aarch64 build
      # links ORT_ANDROID_LIB_LOCATION and must never repopulate this, so if it
      # comes back, ort-sys really did fall back to the CDN. Only the aarch64
      # target: build-android.sh's *host* uniffi-bindgen build still fetches a
      # host prebuilt, which is not shipped and is worth keeping cached.
      - name: Drop any cached aarch64 ORT prebuilt
        run: rm -rf ~/.cache/ort.pyke.io/dfbin/aarch64-linux-android

      # ORT wants cmake >= 3.28 (the image is well past it) and ninja, which it
      # does not ship.
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Keyed on what actually determines the output: the recipe, and the
      # ort-sys version — build-ort-android.sh derives the ONNX Runtime tag from
      # ort-sys's own dist.txt rather than hardcoding it. Keying on all of
      # Cargo.lock instead would pay a ~12 min rebuild on every unrelated
      # dependency bump, which is most of them.
      - name: Derive the ort-sys version
        run: |
          set -euo pipefail
          V="$(awk '/^name = "ort-sys"$/{f=1; next} f && /^version = /{gsub(/"/,"",$3); print $3; exit}' Cargo.lock)"
          test -n "$V" || { echo "::error::could not read ort-sys version from Cargo.lock"; exit 1; }
          echo "ORT_SYS_VERSION=$V" >> "$GITHUB_ENV"

      # Only the static libs, not the 2.2 GB tree. build-ort-android.sh
      # short-circuits when libonnxruntime_common.a and _deps/re2-build/libre2.a
      # are both present — both are .a files — so restoring just these skips the
      # compile. Verified, not assumed: a tree containing nothing but these 81
      # files links and yields a statically linked .so.
      #
      # A SEPARATE entry from the cargo cache above, and unlike that pairing this
      # one is safe. The rule there exists because a restored target/ marks
      # ort-sys's build script as run, suppressing the download that would refill
      # an evicted pyke dir — nothing else can produce it, so it wedges. Here the
      # producer is unconditional: build-android.sh always invokes
      # build-ort-android.sh, which rebuilds whatever is missing. A miss costs
      # ~12 minutes; it cannot wedge.
      - name: Cache ONNX Runtime (built from source)
        uses: actions/cache@v4
        with:
          path: .ort/build-*/Release/**/*.a
          key: ort-src-${{ runner.os }}-${{ env.ORT_SYS_VERSION }}-${{ hashFiles('scripts/build-ort-android.sh') }}

      # ~19 MB of ONNX weights pulled from a fixed release tag, so the key only
      # has to change when the script points at a different release.
      - name: Cache OCR models
        uses: actions/cache@v4
        with:
          path: models
          key: ocr-models-${{ hashFiles('shared/scripts/fetch-models.sh') }}

      - name: Fetch OCR models
        run: ./shared/scripts/fetch-models.sh

      - uses: gradle/actions/setup-gradle@v4

      # gradle.properties is the single source of truth for the NDK revision, and
      # the runner's own ANDROID_NDK_LATEST_HOME is whatever that image happens
      # to ship — it drifts out from under you. Read the pin instead.
      - name: Read the pinned NDK version
        run: |
          echo "BB_NDK=$(awk -F= '/^bb\.ndkVersion=/{gsub(/[[:space:]]/,"",$2); print $2}' \
            gradle.properties)" >> "$GITHUB_ENV"

      # compileSdk 36 + buildToolsVersion 36.0.0 are pinned in
      # app/build.gradle.kts, and the NDK in gradle.properties; the runner image
      # doesn't necessarily ship those exact revisions, and AGP won't fetch them.
      - name: Install the pinned SDK packages
        run: |
          # `yes |` is load-bearing: the pinned NDK is a *preview* package, so
          # sdkmanager stops on the unaccepted android-sdk-preview-license — and
          # still exits 0, leaving the NDK uninstalled. Without this the job dies
          # two steps later in build-android.sh with a confusing version
          # mismatch against whatever NDK the runner image happened to ship.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;$BB_NDK"
          # Fail here, where the cause is legible, rather than downstream.
          test -d "$ANDROID_HOME/ndk/$BB_NDK" || {
            echo "::error::sdkmanager did not install ndk;$BB_NDK"; exit 1; }

      # Cross-compiles bb-receipt-ffi for aarch64-linux-android and regenerates
      # the UniFFI Kotlin. Both are git-ignored, so nothing in bbreceiptkit/ even
      # compiles until this runs. Debug profile: quicker, and enough to prove the
      # tree is green. This is also the step that fails loudly when the pinned
      # core tag moves and ReceiptScanner.kt wasn't adapted.
      - name: Build core (.so + UniFFI Kotlin bindings)
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$BB_NDK" PROFILE=debug ./build-android.sh

      # Moved here from fdroid.yml, which no longer runs on every push. It was
      # never really an F-Droid-specific property: ORT is now compiled from
      # source for every channel, so "nothing prebuilt got linked" is a claim
      # about the library that ships to Play and SafeHaven too, and a silent
      # fallback to the CDN download is exactly the regression worth catching.
      - name: Assert ONNX Runtime was linked from source, not downloaded
        run: |
          set -euo pipefail
          SO=bbreceiptkit/src/main/jniLibs/arm64-v8a/libbb_mobile_ffi.so
          READELF="$ANDROID_HOME/ndk/$BB_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          echo "== DT_NEEDED =="
          "$READELF" -d "$SO" | grep NEEDED
          if "$READELF" -d "$SO" | grep -q 'libonnxruntime'; then
            echo "::error::$SO wants a separate libonnxruntime.so; ORT was not linked statically"
            exit 1
          fi

          # ort-sys caches every CDN download under a per-target directory, so
          # this is a direct statement that the aarch64 library was not fetched.
          # It only says that because "Drop any cached aarch64 ORT prebuilt"
          # emptied it after the cache restore — this directory is cached, so
          # without that step the check reads a stale artefact, not this build.
          #
          # Only the Android target is asserted, and that is not an oversight:
          # build-android.sh also runs a *host* cargo build to generate the Kotlin
          # bindings, and that one does still download a host prebuilt. It is not
          # shipped in the APK — but it is a real open question for F-Droid, whose
          # build would run this same script. Tracked separately.
          CACHED=~/.cache/ort.pyke.io/dfbin/aarch64-linux-android
          if [ -d "$CACHED" ]; then
            echo "::error::$CACHED exists — a prebuilt aarch64 ONNX Runtime was downloaded"
            exit 1
          fi
          echo "OK: ORT statically linked from source, no aarch64 prebuilt fetched"

      - name: Assemble debug APK
        run: ./gradlew :app:assemblePlayDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-play-debug-apk
          path: app/build/outputs/apk/play/debug/app-play-debug.apk
          if-no-files-found: error

      # Context-free JVM logic: the .xlsx writer, amount/price normalization,
      # display formatting. No emulator, no native library.
      - name: JVM unit tests
        run: ./gradlew :app:testPlayDebugUnitTest

      - name: Android Lint
        run: ./gradlew :app:lintPlayDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results-play-debug
          path: app/build/reports/lint-results-playDebug.*
          if-no-files-found: ignore

      # The runtime gate. batch_e2e is the host twin of the on-device
      # BatchRunner: same OcrSession, same ledger defaults, same batch_out.json
      # shape, graded by the same compare-e2e.py the emulator harness uses.
      # Release profile — a debug build of the image/OCR path is minutes slower
      # per scan, and the cargo cache makes this a rebuild of one crate.
      - name: Host E2E — scan the bundled fixture and grade it
        run: |
          set -euo pipefail
          FIX=$(./scripts/e2e-fixtures.sh)
          cargo run --release --bin batch_e2e -- \
            --models models --in-dir "$FIX" --out "$FIX/batch_out.json"
          python3 shared/scripts/compare-e2e.py \
            --results "$FIX/batch_out.json" --manifest "$FIX/manifest.json"

  # The path that actually ships, which nothing exercised until v0.4.0 reached
  # Play as an 81.8 MiB bundle carrying a debug native library. The debug job
  # above deliberately builds PROFILE=debug for speed, so it can prove neither
  # R8 (which only runs for release) nor the strip/symbol extraction — and both
  # gates refuse to run against a debug library, correctly.
  #
  # What this cannot do is prove the JNI seam under R8: no hosted runner can run
  # an arm64 AVD (see the header). That still needs real hardware.
  release-bundle:
    name: Release bundle (R8 + strip + Play gates)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # shared/ (beanbeaver-mobile-util) holds the uniffi-bindgen and
          # batch_e2e sources the Cargo.toml [[bin]] paths point at, plus
          # fetch-models.sh and compare-e2e.py. Without this the cargo
          # build fails on a missing bin path.
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # One entry, same reason as the build job above: target/ and the ORT
      # download directory must be restored together or not at all.
      - name: Cache cargo + ONNX Runtime
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cache/ort.pyke.io
          key: cargo-ort-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ort-${{ runner.os }}-

      # Same three steps as the build job above, and the comments there explain
      # the key and why this cache is a separate entry. This job builds the
      # release artifacts, so it compiles ORT from source too.
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Derive the ort-sys version
        run: |
          set -euo pipefail
          V="$(awk '/^name = "ort-sys"$/{f=1; next} f && /^version = /{gsub(/"/,"",$3); print $3; exit}' Cargo.lock)"
          test -n "$V" || { echo "::error::could not read ort-sys version from Cargo.lock"; exit 1; }
          echo "ORT_SYS_VERSION=$V" >> "$GITHUB_ENV"

      - name: Cache ONNX Runtime (built from source)
        uses: actions/cache@v4
        with:
          path: .ort/build-*/Release/**/*.a
          key: ort-src-${{ runner.os }}-${{ env.ORT_SYS_VERSION }}-${{ hashFiles('scripts/build-ort-android.sh') }}

      - name: Cache OCR models
        uses: actions/cache@v4
        with:
          path: models
          key: ocr-models-${{ hashFiles('shared/scripts/fetch-models.sh') }}

      - name: Fetch OCR models
        run: ./shared/scripts/fetch-models.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Read the pinned NDK version
        run: |
          echo "BB_NDK=$(awk -F= '/^bb\.ndkVersion=/{gsub(/[[:space:]]/,"",$2); print $2}' \
            gradle.properties)" >> "$GITHUB_ENV"

      # The NDK matters more here than in the debug job: AGP strips the .so and
      # extracts the Play debug symbols with it, and silently does neither when
      # it can't resolve one.
      - name: Install the pinned SDK packages
        run: |
          # `yes |` is load-bearing: the pinned NDK is a *preview* package, so
          # sdkmanager stops on the unaccepted android-sdk-preview-license — and
          # still exits 0, leaving the NDK uninstalled. Without this the job dies
          # two steps later in build-android.sh with a confusing version
          # mismatch against whatever NDK the runner image happened to ship.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;$BB_NDK"
          # Fail here, where the cause is legible, rather than downstream.
          test -d "$ANDROID_HOME/ndk/$BB_NDK" || {
            echo "::error::sdkmanager did not install ndk;$BB_NDK"; exit 1; }

      # Release profile on purpose — it is the whole point of this job, and
      # bbreceiptkit's verifyReleaseNativeProfile would refuse a debug library.
      - name: Build core (release .so + UniFFI Kotlin bindings)
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$BB_NDK" ./build-android.sh

      # Unsigned: keystore.properties isn't in git, and signing has no bearing on
      # what the gates read (dex, native libs, BUNDLE-METADATA). verifyReleaseBundle
      # runs automatically as a finalizer.
      - name: Bundle release
        run: ./gradlew :app:bundlePlayRelease

      # Every flavour that is not the bundled one gets assembled here, so none can
      # silently stop building. The bundle above is `play`; these are the other
      # two.
      #
      # R8 over the *fdroid* source set is covered nowhere else — fdroid.yml is
      # parked and built it unminified anyway — and a flavour-specific source file
      # that R8 mishandles would otherwise only surface in a build we never run.
      # It lives here rather than in fdroid.yml because this job already has a
      # release-profile .so, and because it is about R8, not ONNX Runtime. APK,
      # not bundle: F-Droid publishes APKs, and it keeps verifyFdroidReleaseBundle
      # out of the way.
      #
      # `safehaven` shares src/gms with `play`, so today this only proves the
      # flavour is still wired up — which is exactly what would rot silently while
      # the two are identical. It stops being a formality the moment safehaven
      # gains a source set of its own (Play Billing, an in-app updater).
      - name: Assemble the non-bundled flavours (R8 over each source set)
        run: ./gradlew :app:assembleSafehavenRelease :app:assembleFdroidRelease

      # Also moved out of fdroid.yml. It asserted this against a fdroid *debug*
      # APK; here it runs against the R8-minified one, which is strictly better —
      # R8 is what decides which classes survive, so a keep rule dragging GMS
      # back in is only visible after minification.
      #
      # Dormant while safehaven links the same ML Kit scanner as play, and kept
      # anyway: the whole value of the fdroid flavour is that it still compiles and
      # is still GMS-free the day F-Droid is picked back up. That is cheap to
      # assert now and expensive to reconstruct later.
      - name: Assert no Google Play services in the fdroid APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
          # grep -a: dex is binary. Package paths appear as plain strings in the
          # dex string pool, so this sees classes R8 kept for any reason.
          HITS=$(unzip -p "$APK" 'classes*.dex' \
            | LC_ALL=C grep -a -o 'com/google/android/gms/[a-z]*' | sort -u || true)
          if [ -n "$HITS" ]; then
            echo "::error::fdroid APK references Google Play services:"
            echo "$HITS"
            exit 1
          fi
          echo "OK: no com.google.android.gms references in $APK"

      - name: Report what shipped
        run: |
          AAB=app/build/outputs/bundle/playRelease/app-play-release.aab
          ls -l "$AAB"
          unzip -l "$AAB" | grep -E "\.so$|\.dex$|BUNDLE-METADATA" || true

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-play-release-aab
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# The NDK that build-android.sh cross-compiles bb-receipt-ffi with, AND that AGP
# uses to strip native libraries and extract Play debug symbols. They must be the
# same NDK, so this is the single source of truth: app/build.gradle.kts,
# bbreceiptkit/build.gradle.kts, build-android.sh and CI all read it.
#
# Without an explicit ndkVersion, AGP falls back to its own built-in default
# (27.0.12077973 for AGP 8.13.2), fails to find it, and *silently* degrades
# stripReleaseDebugSymbols into a plain file copy. And because
# ExtractNativeDebugMetadataTask skips any library whose stripped output is the
# same length as its input, that silently disabled the Play symbols upload too —
# so `debugSymbolLevel = "FULL"` produced nothing. Every release built before
# this pin shipped unstripped .so files and no symbols.
bb.ndkVersion=30.0.15729638

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

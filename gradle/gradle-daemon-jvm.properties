# Originally generated by `./gradlew updateDaemonJvm`, then hand-edited: the
# generated file also pinned `toolchainVendor=jetbrains`, which made the build
# impossible anywhere Android Studio isn't installed. JBR ships only inside
# JetBrains IDEs, so on a machine without one Gradle tries to *download* it and
# fails with "No defined toolchain download url for <os> on <arch> architecture"
# (CI hit exactly this). The version is what matters; any JDK 21 will do —
# locally that resolves to the Studio JBR anyway.
#
# Don't re-run `updateDaemonJvm` without stripping the vendor line again.
toolchainVersion=21

[package]
name = "beanbeaver-android-ffi-build"
version = "0.0.0"
edition = "2021"
publish = false
default-run = "uniffi-bindgen"

# Standalone Android tree: UniFFI bindgen + host batch_e2e harness.
# Keep the bb-receipt-ffi tag in step with the iOS root Cargo.toml when bumping.
#
# Both bins live in the `shared/` submodule (beanbeaver-mobile-util) — iOS
# builds the same two files from the same commit. They are compiled *here*
# rather than depended on as a crate so each app builds them against its own
# pinned bb-receipt-ffi tag: batch_e2e.rs uses OcrSession/Phase/ScanTimings/
# ReceiptWarningKind, so a breaking FFI bump changes it. `git submodule update
# --init` if `shared/` is empty.

[[bin]]
name = "uniffi-bindgen"
path = "shared/src/bin/uniffi-bindgen.rs"

[[bin]]
name = "batch_e2e"
path = "shared/src/bin/batch_e2e.rs"

[dependencies]
# In step with the iOS root Cargo.toml. v0.7.0 is a BREAKING FFI change — the
# rule corpus became addressable:
#   ReceiptItem.category -> account   (always the resolved beancount account;
#                                      the old field held a classifier key that
#                                      was not necessarily an account)
#   ReceiptItem.tags: [String] -> [ItemTag]  (a stable `path` plus an authored
#                                      `display`, so labels stop being derived
#                                      by capitalizing a raw tag)
#   ParseOptions.item_classifier_override_tomls -> rule_documents
#   new `RuleBook` object exposing tags()/accounts()/rules()/classify()
# v0.7.1 is rules-data only on top of that (PRONAMEL, DOORDASH gift cards) —
# but the rules are compiled into the staticlib, so it still needs a rebuild.
#
# v0.7.1 -> v0.7.11 is parser/rules work only: deskew made reachable, print-grid
# row placement, a subtotal-disagreement warning, tax re-derivation, and a pile
# of keyword fixes. `git diff v0.7.1 v0.7.11 -- crates/ffi/src/lib.rs` is empty,
# so no Kotlin call site moves — same photo, better parse.
#
# v0.8.0 is a BREAKING FFI change — a warning is now a record, not a string:
#   ReceiptResult.warnings: [String] -> [ReceiptWarning]   (kind + message +
#                                      after_item_index, so the client can rank
#                                      a finding instead of guessing from text)
#   ReceiptResult.warning_after_item_indices  — deleted, folded into the record
#   new `ReceiptWarningKind` enum; core reports, the client ranks (see
#   WarningSeverity.kt). Treat it as open: `else ->` must degrade, never crash.
# v0.8.1 -> v0.8.4 is parser/rules work on top: Costco TPD discounts, split tax
# buckets, tax codes kept out of the price column, and tender/total findings.
# Rerun ./build-android.sh after bumping to regenerate the Kotlin glue.
bb-receipt-ffi = { git = "https://github.com/Endle/beanbeaver-core", tag = "v0.8.4" }
# The library the app actually loads. It re-exports nothing and is called only
# through the generated Kotlin; the dependency exists so `cargo build -p
# bb-mobile-ffi` produces libbb_mobile_ffi.so, which carries BOTH uniffi
# namespaces (bb_mobile_ffi + bb_receipt_ffi) in one artifact.
#
# THE TWO PINS ABOVE AND BELOW MUST AGREE ON THE CORE TAG. bb-mobile-ffi pins
# bb-receipt-ffi itself; if this file pins a different tag, cargo resolves two
# copies of the core and the packaged library carries the wrong one. The
# direct bb-receipt-ffi dep is only here for shared/src/bin/batch_e2e.rs, which
# uses the core's Rust API. Cargo.lock is committed — a duplicate
# bb-receipt-ffi entry there is the tell.
bb-mobile-ffi = { git = "https://github.com/Endle/beanbeaver-mobile-util", tag = "v0.1.0" }
# `cli` provides uniffi_bindgen_main for uniffi-bindgen.rs. Keep aligned with
# the uniffi version bb-receipt-ffi pulls in (0.28).
uniffi = { version = "0.28", features = ["cli"] }

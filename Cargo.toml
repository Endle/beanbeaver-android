[package]
name = "beanbeaver-android-ffi-build"
version = "0.0.0"
edition = "2021"
publish = false
default-run = "uniffi-bindgen"

# Standalone Android tree: UniFFI bindgen + host batch_e2e harness.
# Keep the bb-receipt-ffi tag in step with the iOS root Cargo.toml when bumping.
#
# Both bins live in the `shared/` submodule (beanbeaver-mobile-util) — iOS
# builds the same two files from the same commit. They are compiled *here*
# rather than depended on as a crate so each app builds them against its own
# pinned bb-receipt-ffi tag: batch_e2e.rs uses OcrSession/Phase/ScanTimings/
# ReceiptWarningKind, so a breaking FFI bump changes it. `git submodule update
# --init` if `shared/` is empty.

[[bin]]
name = "uniffi-bindgen"
path = "shared/src/bin/uniffi-bindgen.rs"

[[bin]]
name = "batch_e2e"
path = "shared/src/bin/batch_e2e.rs"

# The profile the shipped .so is built with. Cargo honours `[profile.*]` only in
# the workspace root, and this package is that root for everything below it --
# so these two lines apply to bb-mobile-ffi, bb-receipt-ffi and every crate they
# pull in. Without them cargo's defaults (no LTO, 16 codegen units) applied, and
# nothing here had ever set them.
#
# Measured on arm64-v8a, stripped exactly as AGP strips it:
#   26,500,968 -> 25,408,400 bytes  (-1.07 MiB, -4.1%)
# The .so is stored *uncompressed* in the APK (useLegacyPackaging = false, for
# 16 KB page alignment), so every byte saved here is a byte off the download.
#
# Only the ~5 MB of Rust in the library responds to this; the other ~12 MB of
# code is ONNX Runtime, ONNX, Eigen and protobuf, compiled by CMake in
# scripts/build-ort-android.sh and untouched by any cargo profile setting.
#
# `panic = "abort"` is deliberately NOT set. It saves a further ~0.36 MB, but
# UniFFI's scaffolding wraps every call in `catch_unwind` to turn a Rust panic
# into a Kotlin exception; aborting would turn a panic on one odd photo into a
# process kill. Not a trade worth 0.36 MB in an app that parses arbitrary
# user photos.
[profile.release]
lto = "fat"
codegen-units = 1

[dependencies]
# In step with the iOS root Cargo.toml. v0.7.0 is a BREAKING FFI change — the
# rule corpus became addressable:
#   ReceiptItem.category -> account   (always the resolved beancount account;
#                                      the old field held a classifier key that
#                                      was not necessarily an account)
#   ReceiptItem.tags: [String] -> [ItemTag]  (a stable `path` plus an authored
#                                      `display`, so labels stop being derived
#                                      by capitalizing a raw tag)
#   ParseOptions.item_classifier_override_tomls -> rule_documents
#   new `RuleBook` object exposing tags()/accounts()/rules()/classify()
# v0.7.1 is rules-data only on top of that (PRONAMEL, DOORDASH gift cards) —
# but the rules are compiled into the staticlib, so it still needs a rebuild.
#
# v0.7.1 -> v0.7.11 is parser/rules work only: deskew made reachable, print-grid
# row placement, a subtotal-disagreement warning, tax re-derivation, and a pile
# of keyword fixes. `git diff v0.7.1 v0.7.11 -- crates/ffi/src/lib.rs` is empty,
# so no Kotlin call site moves — same photo, better parse.
#
# v0.8.0 is a BREAKING FFI change — a warning is now a record, not a string:
#   ReceiptResult.warnings: [String] -> [ReceiptWarning]   (kind + message +
#                                      after_item_index, so the client can rank
#                                      a finding instead of guessing from text)
#   ReceiptResult.warning_after_item_indices  — deleted, folded into the record
#   new `ReceiptWarningKind` enum; core reports, the client ranks (see
#   WarningSeverity.kt). Treat it as open: `else ->` must degrade, never crash.
# v0.8.1 -> v0.8.4 is parser/rules work on top: Costco TPD discounts, split tax
# buckets, tax codes kept out of the price column, and tender/total findings.
#
# v0.9.0 is NOT a breaking FFI change, despite `git diff v0.8.4 v0.9.0 --
# crates/ffi/src/lib.rs` being non-empty. The five changed lines are imports
# moving from `ocr_paddle::` to the new `scan` composition root (core #61); no
# exported UniFFI signature moved, so no Kotlin call site and no batch_e2e.rs
# symbol changes. The parse content is core #62: QUAIL no longer claims QUALITY,
# and Frozen/Dim Sum department items classify.
#
# v0.9.1 -> v0.9.2 adds ONE enum variant and is not breaking:
# `ReceiptWarningKind::ImplausibleSummary` (core #64) — a summary block that
# cannot be right (no total while items parsed, or subtotal == tax) is now
# reported instead of silently reading 0.00. Kinds are open by contract, so
# WarningSeverity.kt's `else ->` already ranks it; WarningSeverityTest fails if
# a variant goes unranked, which is the gate that makes "additive" safe here.
# The parse content is core #67: Loblaw department headers (21-GROCERY,
# 22-DAIRY, ...) no longer claim the price of a neighbouring row. Measured on
# the 123-receipt private corpus, 885/1008 -> 893/1008 critical items, three
# receipts better and none worse.
#
# v0.9.3 changes no code this app calls. It is dependency hygiene in the core:
# ocr-paddle depended on `imageproc` with default features, whose
# `image/default` re-enabled every codec on the `image` crate and defeated the
# `default-features = false, features = ["jpeg", "png"]` all four core crates
# declare. Cargo unifies features graph-wide, so one permissive dependant
# re-armed avif/exr/gif/tiff/webp/... for the whole graph -- including rav1e, an
# AV1 video *encoder*, at 1.27 MB. Worth 4.03 MiB (-16.7%) of the .so below.
# WebP decoding is kept on purpose: BatchImportScreen.kt hands the picker's raw
# bytes to Rust, which sniffs the format, so dropping it would break importing
# one. The only behavioural change in the v0.9.2..v0.9.3 range is unrelated --
# core #70 files SALT as a seasoning rather than a staple.
#
# v0.9.4 is four item-classification rule fixes found on a device scan (core
# #73), no FFI change: Shodoshima (a vermicelli brand) classifies at all instead
# of coming back uncategorized, a Bay Scallop moves off Seafood:Shrimp onto
# plain Seafood, a "Sugar Baby" watermelon moves off Staple (it was matching
# "SUGAR") onto Fruit, and a bare "Vegetables" department line moves off
# Seasoning onto Vegetable. Visible only as different accounts on those lines.
#
# v0.10.0 changes the MODELS, which is why it is a minor bump and why this
# commit also moves ModelStore.kt, models/README.md and the recorded hashes in
# scripts/ort-required-ops.config. The textline-orientation classifier is now
# PP-LCNet_x0_25 (1.01 MB) instead of PP-LCNet_x1_0 (6.77 MB) -- upstream's own
# smaller variant. Core looks these files up by exact name (`scan::model_files`),
# so the asset must be renamed in the SAME commit as this pin or session load
# dies on a missing file; `shared/` moves to v0.1.7 for the same reason, because
# its fetch-models.sh now pulls ocr-models-v2. Measured equivalent before
# shipping: device_sim over the 123-receipt private corpus gave identical
# merchant/date/total/crit-item totals with ZERO per-receipt divergence, while
# classify fell 205 ms -> 77 ms. The converted graph keeps the same 15 op types
# in the same counts, so the ORT operator list is unaffected. The trade:
# upstream rates x0_25 at 98.85% top-1 vs 99.42% and it is weaker on
# 180deg-rotated text -- every corpus receipt is upright, so it costs nothing
# there. Accepted deliberately. No FFI surface change: the diff under
# crates/ffi/ is private constants moving out plus a doc comment.
# Rerun ./build-android.sh after bumping to regenerate the Kotlin glue.
# v0.13.1 is parser + rules only, no FFI change: a curled receipt whose price
# column drifts most of a row at the top of the item block and is straight by
# the bottom (core #97); COCKTAIL JCE / PC 100% CRAN classify as juice; DEPOSIT
# VL files to Expenses:Deposit instead of FIXME.
#
# v0.13.2 adds ONE field to the UniFFI surface: `ReceiptItem.tag_path`, the
# classification path that actually won and claimed the account. It used to be
# recovered from `tags.last()`, which only worked while the deepest tag was the
# winning one -- a discount line carries `discount` alongside `grocery/dairy`,
# and which of them sorts last is not a fact about the classifier. Additive on
# the wire, but the generated Kotlin data class gains a constructor parameter
# with no default, so every `ReceiptItem(...)` construction site had to pass
# it -- and a POSITIONAL call (SpendSummaryTest's helper was one) would have
# shifted silently rather than failed, so they are all named now. The rest of
# the release is receipt-core's structural refactor -- `fields.rs` split into
# `fields/{amounts,dates,prices,tenders}`, the spatial and text engines into
# `rows`/`pairing` modules, and the detection page becoming a type whose
# normalization passes run through a runner.
#
# v0.14.0 adds ONE more field, in the same shape and with the same consequence:
# `item_number`, the merchant's printed item code, on BOTH `ReceiptItem` and
# `EditedItem`. Kept as a string because the codes have leading zeros that a
# number would eat. The construction sites here are `ReceiptResultJson.decode`
# (the batch draft on disk -- an older file has no such key, and null is right
# because the code is only ever read off the receipt) and `ReceiptEditing.kt`'s
# `edited()`. The edit path carries the code rather than dropping it: core
# preserves the prior code only while the description is unchanged, so a
# RENAMED line loses its item number unless the caller hands the original back.
#
# Also in v0.14.0: a parser fix for suggested-retail rows -- OCR can fuse a
# receipt's Chinese sub-line onto the `REG$` marker ("MF7KREG$1.99"), and the
# backward description walk used to read that as the product name, burying the
# real one on the line above. Plus five classifier rules (OASIS, bare SAUCE,
# NOODLE SAUCE, BUTTER FLAVORED, PROSPER UNITY).
#
# v0.14.1 is a pure parser patch -- `crates/ffi/` is byte-identical to v0.14.0,
# so nothing here needed a hand edit, only regenerated bindings. It carries two
# fixes, both found on real XV scans: three defects from a Canadian Tire and a
# Costco pay-station receipt, and a Costco discount row surviving OCR that drops
# the slash in `TPD/<sku>`. The latter cost a 300.08 receipt one of its two
# -6.00 rows -- the total read correctly while the ledger sat 6.00 from
# balancing -- because the bare `TPD` spelling lost both the parser's
# alpha-ratio waiver and the classifier's discount keyword.
#
# v0.14.2 is another pure parser patch -- `crates/ffi/` byte-identical again,
# regenerated bindings only. It fixes amounts landing on the sub-line *above*
# their item when perspective lifts the amount column relative to the text
# column: on the XV Foody Mart scan that found it, the two candidate rows
# overlapped the contested amount by exactly 0.745 each, so first-fit gave it
# to the row above and the receipt parsed 14 lines for a printed 16, running
# 1.96 short of its own subtotal. What breaks that tie is arithmetic, not
# geometry -- a `1 @ $0.98` row cannot be holding 3.99. Measured over the
# 143-receipt corpus: no receipt regresses live or cached, and one unrelated
# Bestco Fresh receipt gets an item back.
#
# The model set is unchanged across v0.13.0 -> v0.14.2 (`docs/ocr-models.md`
# and `model_files.rs` are byte-identical), so ModelStore.kt, models/README.md,
# the recorded hashes in scripts/ort-required-ops.config and the `shared/`
# submodule all stay where they are -- iOS did not move its submodule either.
bb-receipt-ffi = { git = "https://github.com/Endle/beanbeaver-core", tag = "v0.14.2" }
# The library the app actually loads. It re-exports nothing and is called only
# through the generated Kotlin; the dependency exists so `cargo build -p
# bb-mobile-ffi` produces libbb_mobile_ffi.so, which carries BOTH uniffi
# namespaces (bb_mobile_ffi + bb_receipt_ffi) in one artifact.
#
# THE TWO PINS ABOVE AND BELOW MUST AGREE ON THE CORE TAG. bb-mobile-ffi pins
# bb-receipt-ffi itself; if this file pins a different tag, cargo resolves two
# copies of the core and the packaged library carries the wrong one. The
# direct bb-receipt-ffi dep is only here for shared/src/bin/batch_e2e.rs, which
# uses the core's Rust API. Cargo.lock is committed — a duplicate
# bb-receipt-ffi entry there is the tell.
# NOT yet carrying features = ["xnnpack"], though core v0.9.3+ and
# bb-mobile-ffi v0.1.5+ both offer it and scripts/build-ort-android.sh builds ORT
# with --use_xnnpack. Enabling it fails at link with hundreds of undefined
# hidden `xnn_*` microkernel symbols: ort-sys does not add XNNPACK's kernel
# archives to the link line, the same shape as the re2 trap in
# build-ort-android.sh. Until that is solved, PP-OCRv5 stays on the plain CPU
# EP here (MLAS -- NEON, but CPU). Measured on an SM-X218U: det 1088 ms,
# rec 3573 ms, 5426 ms wall for one receipt.
#
# iOS is on the plain CPU EP too -- this comment used to say it used CoreML,
# which has been wrong since beanbeaver-ios 3c580a6 (2026-07-01, "drop CoreML --
# CPU wins on speed and accuracy"). Corrected in the umbrella CLAUDE.md (
# bb-workspace #1); fixed here because the same sentence had been copied in.
# v0.1.16 .. v0.1.20 each carry one core tag (v0.13.1, v0.13.2, v0.14.0,
# v0.14.1, v0.14.2) and nothing else -- no spend-layer change, so every
# SpendXxx signature is as it was in v0.1.10.
bb-mobile-ffi = { git = "https://github.com/Endle/beanbeaver-mobile-util", tag = "v0.1.20" }
# `cli` provides uniffi_bindgen_main for uniffi-bindgen.rs. Keep aligned with
# the uniffi version bb-receipt-ffi pulls in (0.28).
uniffi = { version = "0.28", features = ["cli"] }


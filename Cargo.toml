[package]
name = "beanbeaver-android-ffi-build"
version = "0.0.0"
edition = "2021"
publish = false
default-run = "uniffi-bindgen"

# Standalone Android tree: UniFFI bindgen + host batch_e2e harness.
# Keep the bb-receipt-ffi tag in step with the iOS root Cargo.toml when bumping.

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[[bin]]
name = "batch_e2e"
path = "src/bin/batch_e2e.rs"

[dependencies]
# In step with the iOS root Cargo.toml. v0.6.4 → v0.7.x is the rules release:
# `ReceiptItem.category` became `account`, `tags` became labelled `[ItemTag]`
# nodes (stable `path` + authored `display`), the RuleBook crossed the FFI
# (tags()/categories()/rules()/explain()), and ParseOptions gained
# `rule_documents` for user rule overlays. That is an FFI signature change —
# ReceiptScanner.kt, ReceiptResultJson.kt and src/bin/batch_e2e.rs were all
# adapted in the same change (see CLAUDE.md: "FFI signature change" path).
# Rerun ./build-android.sh after bumping to regenerate the Kotlin glue.
bb-receipt-ffi = { git = "https://github.com/Endle/beanbeaver-core", tag = "v0.7.11" }
# `cli` provides uniffi_bindgen_main for uniffi-bindgen.rs. Keep aligned with
# the uniffi version bb-receipt-ffi pulls in (0.28).
uniffi = { version = "0.28", features = ["cli"] }
